<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebESP - ESP固件一键烧录工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 页面标题 -->
    <div class="logo">
      <h1>WebESP 固件一键烧录工具</h1>
    </div>

    <!-- 核心左右分栏布局 -->
    <div class="main-layout">
      <!-- 左侧：操作区（设备选择+端口连接+烧录） -->
      <div class="left-panel">
        <div class="card">
          <!-- 步骤1：设备选择（图片卡片式） -->
          <div class="form-step step1">
            <div class="step-title">选择设备型号</div>
            <label>点击选择你的设备（自动匹配对应固件）</label>
            <!-- 设备卡片容器（JS自动加载图片+设备信息） -->
            <div class="device-cards" id="device-cards"></div>
            <!-- 选中设备信息展示 -->
            <div id="chip-info" class="hidden">关联芯片：<span id="chip-name">未知</span></div>
            <div class="firmware-tip">
              已匹配固件：<span id="firmware-info">未选择设备</span>
            </div>
          </div>

          <!-- 步骤2：端口连接（移除下拉框，仅保留按钮） -->
          <div class="form-step step2">
            <div class="step-title">连接设备端口</div>
            <label>点击按钮后在弹窗中选择你的ESP设备端口</label>
            <!-- 仅保留连接按钮，无下拉框 -->
            <button id="connect-port" disabled class="port-btn">🔌 连接端口</button>
          </div>

          <!-- 步骤3：一键烧录 -->
          <div class="form-step step3">
            <div class="step-title">开始烧录固件</div>
            <button id="burn-firmware" disabled class="btn-burn">⚡ 一键烧录固件</button>
            <progress id="burn-progress" value="0" max="100" class="hidden"></progress>
          </div>

          <!-- 状态提示 -->
          <div class="status-bar">
            <span>设备状态：<span id="device-status">未选择</span></span>
            <span>端口状态：<span id="port-status">未连接</span></span>
          </div>
        </div>
      </div>

      <!-- 右侧：日志区 -->
      <div class="right-panel">
        <div class="card log-card">
          <div class="step-title">烧录日志</div>
          <div id="log-box" readonly></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入脚本文件（保持顺序） -->
  <script type="module" src="firmware-library.js"></script>
  <script type="module" src="app.js"></script>
  <script src="esptool.min.js"></script>
</body>
</html>
