<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>LILYGO ESP32 在线刷机</title>

  <script type="module">
    import { install } from "https://unpkg.com/esp-web-tools@9/dist/web/install-button.js";

    window.addEventListener("DOMContentLoaded", () => {
      const button = document.querySelector("#flash-btn");
      const status = document.querySelector("#status");

      install(button, {
        manifest: "/LILYGO_Launchpad/firmware/manifest.json"
      })
      .then(() => {
        status.textContent = "刷机完成！";
      })
      .catch(err => {
        status.textContent = "刷机失败: " + err;
      });
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f7;
      padding: 40px;
      display: flex;
      justify-content: center;
    }
    .container { display: flex; max-width: 900px; width: 100%; gap: 20px; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex: 1;
    }
    h2 { margin-bottom: 15px; }
    #flash-btn {
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      background-color: #1976d2;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #flash-btn:hover { background-color: #0f62b4; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>

</head>
<body>
  <div class="container">

    <div class="card">
      <h2>ESP32 设备刷机</h2>
      <p>通过浏览器直接刷写 ESP32 固件，无需安装软件。</p>
      <p>确保电脑支持 Chrome / Edge，并使用数据线连接 ESP32。</p>
    </div>

    <div class="card">
      <h2>开始刷写</h2>
      <p>点击下方按钮连接设备并开始刷写固件。</p>
      <button id="flash-btn">连接并刷写 ESP32</button>
      <p id="status"></p>
    </div>

  </div>
</body>
</html>
