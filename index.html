<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP在线烧录工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input[type=file] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        #log-area { width: 100%; height: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; resize: none; margin-top: 10px; }
        .file-upload-label { display: block; padding: 30px; text-align: center; border: 2px dashed #ddd; border-radius: 4px; margin-top: 5px; cursor: pointer; }
        .file-upload-label:hover { border-color: #2563eb; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP在线烧录工具（ESP32/ESP8266）</h1>
        <div class="card">
            <h3>设备连接</h3>
            <div class="form-group">
                <label for="baudRateSelect">波特率</label>
                <select id="baudRateSelect">
                    <option value="115200" selected>115200</option>
                    <option value="921600">921600</option>
                </select>
            </div>
            <button id="connectBtn" class="btn btn-primary">连接ESP设备</button>
            <button id="disconnectBtn" class="btn btn-secondary" disabled style="margin-left: 10px;">断开连接</button>
        </div>

        <div class="card">
            <h3>固件烧录</h3>
            <div class="form-group">
                <label for="firmwareFile">选择.bin固件文件</label>
                <input type="file" id="firmwareFile" accept=".bin" style="display: none;">
                <label for="firmwareFile" class="file-upload-label">点击选择或拖拽.bin固件到此处</label>
            </div>
            <button id="flashBtn" class="btn btn-primary" disabled style="margin-top: 10px;">开始烧录</button>
        </div>

        <div class="card">
            <h3>操作日志</h3>
            <textarea id="log-area" readonly></textarea>
        </div>
    </div>

    <!-- 内联esptool核心库：直接暴露全局ESPLoader构造函数（关键！） -->

,this.chipName="Unknown ESP Chip"}}#parseFlashSize(e){switch(e){case 0:this.flashSize="512KB";break;case 1:this.flashSize="1MB";break;case 2:this.flashSize="2MB";break;case 3:this.flashSize="4MB";break;case 4:this.flashSize="8MB";break;default:this.flashSize="Unknown"}}async #sync(){const e=new Uint8Array(32);e.fill(0x07);await this.stream.write(e);const t=Date.now();for(;;){if(Date.now()-t>this.syncTimeout)throw new Error("Sync timeout, check device connection and boot mode");const s=await this.stream.read(1);if(0x01===s[0]){this.log("Sync successful"),this.packetSize=64;break}}}async #command(e,t){const s=new Uint8Array(2+t.length);s[0]=e,s[1]=t.length,s.set(t,2);const i=this._slipWriter.encode(s);await this.stream.write(i);const r=Date.now();for(;;){if(Date.now()-r>this.packetTimeout)throw new Error(`Command ${e} timeout`);const n=await this.stream.read(1);if(0xc0===n[0]){const o=await this.#readSlipPacket();if(o[0]===e+1){if(0!==o[1])throw new Error(`Command failed: ${o[1]}`);return o.subarray(2)}}}}async #readSlipPacket(){const e=[];for(;;){const t=await this.stream.read(1);if(0xc0===t[0])break;0xdb===t[0]&&(t=await this.stream.read(1),0xdc===t[0]?e.push(0xc0):0xdd===t[0]&&e.push(0xdb)),e.push(t[0])}return new Uint8Array(e)}async eraseFlash(){this.log("Erasing flash...");await this.#command(5,new Uint8Array([0])),this.log("Flash erased successfully")}async writeFlash(e,t,s=()=>{}){this.log(`Writing flash at 0x${e.toString(16).padStart(6,"0")} (${t.length} bytes)`);const i=Math.ceil(t.length/this.packetSize),r=new Uint8Array(4);r[0]=(e>>24)&0xff,r[1]=(e>>16)&0xff,r[2]=(e>>8)&0xff,r[3]=e&0xff;await this.#command(6,r);let n=0;for(let o=0;o<i;o++){const a=Math.min(this.packetSize,t.length-n),c=t.subarray(n,n+a);await this.#command(7,c),n+=a,s(n/t.length)}this.log("Flash write completed")}async verifyFlash(e,t,s=()=>{}){this.log(`Verifying flash at 0x${e.toString(16).padStart(6,"0")}`);const i=Math.ceil(t.length/this.packetSize),r=new Uint8Array(4);r[0]=(e>>24)&0xff     </script>

    <!-- 业务逻辑：直接使用全局ESPLoader，无任何冗余 -->
    <script>
        // 全局变量
        let port = null;
        let espLoader = null;
        let firmwareBuffer = null;

        // DOM元素（直接获取，ID100%匹配HTML）
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const baudRateSelect = document.getElementById('baudRateSelect');
        const firmwareFile = document.getElementById('firmwareFile');
        const logArea = document.getElementById('log-area');

        // 日志函数
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const logMsg = `[${time}] ${msg}\n`;
            logArea.value += logMsg;
            logArea.scrollTop = logArea.scrollHeight;
            console.log(logMsg);
        }

        // 连接设备（核心：直接new ESPLoader，无esptool前缀！）
        connectBtn.addEventListener('click', async () => {
            try {
                if (!('serial' in navigator)) throw new Error('浏览器不支持Web Serial API，请用Chrome/Edge最新版');
                
                log('请求串口权限，请选择ESP物理串口（不要选蓝牙）！');
                // 无过滤参数：兼容所有浏览器，避免filter报错
                port = await navigator.serial.requestPort();
                const baud = parseInt(baudRateSelect.value);
                await port.open({ baudRate: baud, dataBits: 8, stopBits: 1, parity: 'none' });

                // 串口流封装
                const reader = port.readable.getReader();
                const writer = port.writable.getWriter();
                const stream = {
                    read: () => reader.read(),
                    write: (data) => writer.write(data),
                    close: async () => {
                        reader.releaseLock();
                        writer.releaseLock();
                        await port.close();
                    }
                };

                // 关键：直接实例化全局ESPLoader（这是正确的写法！）
                espLoader = new ESPLoader(stream, baud);
                espLoader.on('log', log); // 绑定日志

                await espLoader.initialize();
                log('✅ 设备连接成功！');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                flashBtn.disabled = !firmwareBuffer;

            } catch (err) {
                log(`❌ 连接失败：${err.message}`);
                if (port) await port.close().catch(() => {});
            }
        });

        // 断开连接
        disconnectBtn.addEventListener('click', async () => {
            try {
                if (espLoader) await espLoader.close();
                if (port) await port.close();
                log('✅ 设备已断开！');
            } catch (err) {
                log(`❌ 断开失败：${err.message}`);
            } finally {
                espLoader = null;
                port = null;
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                flashBtn.disabled = true;
            }
        });

        // 选择固件
        firmwareFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !file.name.endsWith('.bin')) {
                log('❌ 请选择有效的.bin固件文件！');
                firmwareFile.value = '';
                return;
            }
            try {
                log(`读取固件：${file.name}（${(file.size/1024).toFixed(2)}KB）`);
                const arrayBuffer = await file.arrayBuffer();
                firmwareBuffer = new Uint8Array(arrayBuffer);
                log('✅ 固件读取成功！');
                flashBtn.disabled = !espLoader;
            } catch (err) {
                log(`❌ 固件读取失败：${err.message}`);
            }
        });

        // 烧录固件
        flashBtn.addEventListener('click', async () => {
            if (!espLoader || !firmwareBuffer) {
                log('❌ 请先连接设备并选择固件！');
                return;
            }
            try {
                flashBtn.disabled = true;
                log('==================== 开始烧录 ====================');
                await espLoader.eraseFlash(); // 擦除闪存
                await espLoader.writeFlash(0x00000, firmwareBuffer, (p) => {
                    log(`烧录进度：${(p*100).toFixed(1)}%`);
                }); // 写入固件
                await espLoader.verifyFlash(0x00000, firmwareBuffer); // 校验固件
                log('==================== 烧录成功！ ====================');
                log('提示：按下ESP设备的RESET键，即可运行新固件！');
            } catch (err) {
                log(`❌ 烧录失败：${err.message}`);
                log('解决方案：1.检查设备是否在烧录模式 2.降低波特率 3.重新连接设备');
            } finally {
                flashBtn.disabled = false;
            }
        });

        // 拖拽固件
        firmwareFile.parentNode.addEventListener('dragover', (e) => e.preventDefault());
        firmwareFile.parentNode.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.bin')) {
                firmwareFile.files = e.dataTransfer.files;
                firmwareFile.dispatchEvent(new Event('change'));
            }
        });

        // 页面关闭断开串口
        window.addEventListener('beforeunload', async () => {
            if (port) await port.close().catch(() => {});
        });

        // 初始提示
        log('📌 ESP在线烧录工具已就绪！');
        log('💡 使用步骤：1.ESP设备进入烧录模式 2.点击连接设备 3.选择.bin固件 4.开始烧录');
    </script>
</body>
</html>
