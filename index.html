<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebESP - ESP固件一键烧录工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>WebESP 固件一键烧录工具</h1>
    </div>

    <!-- 左右分栏布局 -->
    <div class="main-layout">
      <!-- 左侧：操作区（保留你源码的所有功能+图片卡片） -->
      <div class="left-panel">
        <div class="card">
          <!-- 步骤1：图片卡片选设备 -->
          <div class="form-step step1">
            <div class="step-title">选择设备型号</div>
            <label>点击设备图片选择（自动匹配对应固件）</label>
            <div class="device-cards" id="device-cards"></div>
            <div id="chip-info" class="hidden">关联芯片：<span id="chip-name">未知</span></div>
          </div>

          <!-- 步骤2：保留你源码的核心功能区 -->
          <div class="form-step step2">
            <div class="step-title">连接设备</div>
            <label for="baudrate">波特率</label>
            <select id="baudrate" class="form-control">
              <option value="115200" selected>115200</option>
              <option value="9600">9600</option>
              <option value="57600">57600</option>
              <option value="230400">230400</option>
            </select>
            <button id="connect" class="port-btn">🔌 连接设备端口</button>
            <div class="status-bar mt-1">
              <span>设备状态：<span id="board">未连接</span></span>
              <span>端口状态：<span id="status">未连接</span></span>
            </div>
          </div>

          <!-- 步骤3：保留你源码的文件管理+烧录功能 -->
          <div class="form-step step3">
            <div class="step-title">固件烧录</div>
            <!-- 文件列表 -->
            <div id="file-list" class="file-list">
              <div class="file-entry">
                <input type="text" class="address-input" value="0x000000" placeholder="Flash地址">
                <input type="file" class="file-input">
                <button class="remove-file">-</button>
              </div>
            </div>
            <button id="add-file" class="add-file-btn">+ 添加固件文件</button>
            
            <!-- 烧录选项 -->
            <div class="flash-options mt-1">
              <label>
                <input type="checkbox" id="erase-all" checked> 擦除全部Flash
              </label>
              <label>
                <input type="checkbox" id="compress" checked> 压缩烧录
              </label>
            </div>

            <!-- 操作按钮 -->
            <div class="flash-buttons mt-1">
              <button id="erase" class="erase-btn">🗑️ 擦除Flash</button>
              <button id="flash" class="btn-burn">⚡ 一键烧录固件</button>
            </div>

            <!-- 进度条 -->
            <progress-bar id="progress-bar" value="0" max="100" class="mt-1"></progress-bar>
          </div>
        </div>
      </div>

      <!-- 右侧：日志区（保留你源码的彩色日志） -->
      <div class="right-panel">
        <div class="card log-card">
          <div class="step-title">烧录日志</div>
          <textarea id="output" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="firmware-library.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</body>
</html>
