<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebESP - ESP固件一键烧录工具</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入CryptoJS（用于MD5校验） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="logo">
      <h1>WebESP 固件一键烧录工具</h1>
    </div>

    <!-- 左右分栏布局 -->
    <div class="main-layout">
      <!-- 左侧：操作区 -->
      <div class="left-panel">
        <!-- 三个选择卡片 -->
        <div class="card-selection">
          <div class="selection-card active" data-type="quick">
            <div class="card-icon">⚡</div>
            <div class="card-title">快捷烧录</div>
            <div class="card-desc">选设备 → 0x0地址 → 一键烧录</div>
          </div>
          <div class="selection-card" data-type="custom">
            <div class="card-icon">🔧</div>
            <div class="card-title">自定义烧录</div>
            <div class="card-desc">自由选固件 → 自定义地址</div>
          </div>
          <div class="selection-card" data-type="erase">
            <div class="card-icon">🗑️</div>
            <div class="card-title">擦除Flash</div>
            <div class="card-desc">仅擦除设备Flash → 无需固件</div>
          </div>
        </div>

        <!-- 功能区1：快捷烧录 -->
        <div class="function-card active" id="quick-card">
          <div class="function-title">快捷烧录配置</div>
          <label>点击设备图片选择（自动匹配0x0地址）</label>
          <div class="device-cards" id="device-cards"></div>
          <div id="chip-info" class="hidden mt-1">关联芯片：<span id="chip-name">未知</span></div>

          <div class="mt-2">
            <label for="quick-baudrate">波特率</label>
            <select id="quick-baudrate" class="form-control">
              <option value="115200" selected>115200</option>
              <option value="9600">9600</option>
              <option value="57600">57600</option>
              <option value="230400">230400</option>
            </select>
            <button id="quick-connect" class="port-btn mt-1">🔌 连接设备端口</button>
            <div class="status-bar mt-1">
              <span>设备状态：<span id="quick-board">未连接</span></span>
              <span>端口状态：<span id="quick-status">未连接</span></span>
            </div>
          </div>

          <div class="mt-2">
            <label>选择固件文件（地址固定0x0）</label>
            <div class="file-entry">
              <input type="text" class="address-input" value="0x000000" placeholder="Flash地址" readonly>
              <input type="file" class="file-input" id="quick-file">
            </div>
            <label class="mt-1">
              <input type="checkbox" id="quick-erase-all" checked> 擦除全部Flash后烧录
            </label>
          </div>

          <button id="quick-flash" class="btn-burn mt-2 w-100">⚡ 一键烧录固件</button>
          <progress-bar id="quick-progress" value="0" max="100" class="mt-1"></progress-bar>
        </div>

        <!-- 功能区2：自定义烧录 -->
        <div class="function-card" id="custom-card">
          <div class="function-title">自定义烧录配置</div>
          <div>
            <label for="custom-baudrate">波特率</label>
            <select id="custom-baudrate" class="form-control">
              <option value="115200" selected>115200</option>
              <option value="9600">9600</option>
              <option value="57600">57600</option>
              <option value="230400">230400</option>
            </select>
            <button id="custom-connect" class="port-btn mt-1">🔌 连接设备端口</button>
            <div class="status-bar mt-1">
              <span>端口状态：<span id="custom-status">未连接</span></span>
            </div>
          </div>

          <div class="mt-2">
            <label>固件文件列表（自定义地址）</label>
            <div id="custom-file-list" class="file-list">
              <div class="file-entry">
                <input type="text" class="address-input" value="0x000000" placeholder="Flash地址">
                <input type="file" class="file-input">
                <button class="remove-file">-</button>
              </div>
            </div>
            <button id="custom-add-file" class="add-file-btn mt-1">+ 添加固件文件</button>
            <label class="mt-1">
              <input type="checkbox" id="custom-erase-all" checked> 擦除全部Flash后烧录
            </label>
          </div>

          <button id="custom-flash" class="btn-burn mt-2 w-100">⚡ 一键烧录固件</button>
          <progress-bar id="custom-progress" value="0" max="100" class="mt-1"></progress-bar>
        </div>

        <!-- 功能区3：擦除Flash -->
        <div class="function-card" id="erase-card">
          <div class="function-title">擦除Flash配置</div>
          <label for="erase-baudrate">波特率</label>
          <select id="erase-baudrate" class="form-control">
            <option value="115200" selected>115200</option>
            <option value="9600">9600</option>
            <option value="57600">57600</option>
            <option value="230400">230400</option>
          </select>
          <button id="erase-connect" class="port-btn mt-1">🔌 连接串口</button>
          <div class="status-bar mt-1">
            <span>端口状态：<span id="erase-status">未连接</span></span>
          </div>
          <button id="erase-flash" class="erase-btn mt-2 w-100">🗑️ 执行擦除Flash</button>
        </div>
      </div>

      <!-- 右侧：日志区 -->
      <div class="right-panel">
        <div class="card log-card">
          <div class="function-title">操作日志</div>
          <textarea id="output" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- 依赖引入 -->
  <script src="esptool.min.js"></script>
  <script type="module" src="firmware-library.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
