<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ESP 烧录器（集成 esptool‑js）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ESP 烧录器</h1>

    <!-- 按钮：连接 ESP 串口设备 -->
    <div class="section">
      <button id="connectBtn">连接设备</button>
      <span id="deviceStatus">未连接</span>
    </div>

    <!-- 固件 URL 输入和下载 -->
    <div class="section">
      <label>固件 URL：</label>
      <input type="text" id="firmwareUrl" placeholder="https://example.com/firmware.bin" />
      <button id="downloadBtn">下载固件</button>
    </div>

    <!-- 烧录按钮 -->
    <div class="section">
      <button id="flashBtn">刷写固件</button>
    </div>

    <!-- 日志输出 -->
    <div class="section">
      <h3>日志</h3>
      <pre id="log"></pre>
    </div>
  </div>

  <!-- 引入 esptool‑js 官方 bundle -->
  <script src="https://unpkg.com/esptool-js/bundle.js"></script>

  <!-- 主逻辑 -->
  <script src="main.js"></script>
</body>
</html>
