<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>LILYGO Launchpad - 固件刷写器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>🔥 LILYGO Launchpad 固件刷写器</h2>

    <div id="uploadBox" class="upload-area">点击或拖拽固件（.bin）</div>
    <input type="file" id="firmwareFile" accept=".bin" style="display:none">

    <button id="flashBtn" disabled>⚡ 烧录固件</button>

    <pre id="log"></pre>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
