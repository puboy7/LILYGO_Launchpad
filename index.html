<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP Web Flasher</title>
  <link rel="stylesheet" href="style.css">
  <script src="esptool.min.js"></script>
  <script src="script.js"></script>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ESP Web Flasher</h1>
    <p>网页端 ESP32/ESP8266 固件烧录工具</p>
  </div>

  <div class="card-container">
    <!-- 左侧：设备连接 -->
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19 7v4H5V7h14m0-2H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 10H5v4c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4z"/>
        </svg>
        设备连接
      </div>
      <div class="form-group">
        <label for="baudRateSelect">波特率</label>
        <select id="baudRateSelect" class="select-control">
          <option value="921600" selected>921600（推荐）</option>
          <option value="115200">115200</option>
          <option value="57600">57600</option>
        </select>
      </div>
      <div class="form-group">
        <button id="connectBtn" class="btn btn-primary">选择并连接 ESP 设备</button>
      </div>
      <div class="form-group">
        <button id="disconnectBtn" class="btn btn-secondary" disabled>断开连接</button>
      </div>
    </div>

    <!-- 右侧：固件烧录 -->
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
          <path d="M14 3v5h5"/>
        </svg>
        固件烧录
      </div>
      <div class="form-group">
        <label for="firmwareFile">固件文件（.bin）</label>
        <input type="file" id="firmwareFile" accept=".bin" class="file-upload">
        <label for="firmwareFile" class="file-upload-label">点击或拖拽上传固件</label>
      </div>
      <div class="form-group">
        <label for="flashMode">烧录模式</label>
        <select id="flashMode" class="select-control">
          <option value="update" selected>仅更新固件（保留数据）</option>
          <option value="wipe">擦除全部后安装</option>
        </select>
      </div>
      <div class="form-group">
        <button id="flashBtn" class="btn btn-primary" disabled>开始烧录固件</button>
      </div>
    </div>
  </div>

  <!-- 日志 -->
  <div class="log-section">
    <div class="log-title">烧录日志</div>
    <textarea id="log-area" readonly placeholder="日志将显示在这里..."></textarea>
  </div>
</div>

</body>
</html>
