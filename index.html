<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebESP - ESP固件一键烧录工具</title>
  <!-- 引入独立样式文件 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>WebESP 固件一键烧录工具</h1>
    </div>

    <!-- 核心操作卡片 -->
    <div class="card">
      <!-- 步骤1：选择设备（ABCD型号，显示关联芯片） -->
      <div class="form-step step1">
        <div class="step-title">选择设备型号</div>
        <label for="device-select">请选择你的设备（自动匹配对应固件）</label>
        <select id="device-select">
          <option value="" selected disabled>—— 请选择设备型号 ——</option>
          <!-- 设备选项由JS自动加载 -->
        </select>
        <div id="chip-info" class="hidden">关联芯片：<span id="chip-name">未知</span></div>
        <div class="firmware-tip">
          已匹配固件：<span id="firmware-info">未选择设备</span>
        </div>
      </div>

      <!-- 步骤2：选择端口并连接 -->
      <div class="form-step step2">
        <div class="step-title">选择并连接设备端口</div>
        <label for="port-select">请先连接设备到电脑，再选择端口</label>
        <select id="port-select" disabled>
          <option value="" selected disabled>—— 请先选择设备 ——</option>
        </select>
        <button id="connect-port" disabled style="margin-top: 0.8rem;">🔌 连接端口</button>
      </div>

      <!-- 步骤3：一键烧录 -->
      <div class="form-step step3">
        <div class="step-title">开始烧录固件</div>
        <button id="burn-firmware" disabled class="btn-burn">⚡ 一键烧录固件</button>
        <progress id="burn-progress" value="0" max="100" class="hidden"></progress>
      </div>

      <!-- 状态提示 -->
      <div class="status-bar">
        <span>设备状态：<span id="device-status">未选择</span></span>
        <span>端口状态：<span id="port-status">未连接</span></span>
      </div>
    </div>

    <!-- 日志输出 -->
    <div class="card">
      <div class="step-title" style="margin-bottom: 0.8rem;">烧录日志</div>
      <div id="log-box" readonly></div>
    </div>
  </div>

  <!-- 引入脚本文件（保持原有顺序） -->
  <script type="module" src="firmware-library.js"></script>
  <script type="module" src="app.js"></script>
  <script src="esptool.min.js"></script>
</body>
</html>
