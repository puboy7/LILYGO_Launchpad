<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebESP - ESP 网页下载器</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --secondary: #f97316;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      gap: 2rem;
      display: grid;
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .container {
        grid-template-columns: 300px 1fr;
      }
    }
    .card {
      background: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      transition: all 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    }
    h1, h2, h3 {
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--primary);
    }
    h1 {
      font-size: 1.875rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text);
    }
    input, select, button {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    input:focus, select:focus, button:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    button:hover {
      background-color: var(--primary-light);
    }
    button.secondary {
      background-color: var(--secondary);
    }
    button.secondary:hover {
      background-color: #ea580c;
    }
    button.danger {
      background-color: var(--danger);
    }
    button.danger:hover {
      background-color: #dc2626;
    }
    .file-entry {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      align-items: center;
    }
    .file-entry input[type="text"] {
      flex: 0 0 120px;
    }
    .file-entry input[type="file"] {
      flex: 1;
    }
    .file-entry button {
      flex: 0 0 40px;
      padding: 0.75rem 0;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .checkbox-group input {
      width: auto;
    }
    progress-bar {
      width: 100%;
      height: 1rem;
      background-color: var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      margin: 1rem 0;
      display: block;
    }
    progress-bar::-webkit-progress-bar {
      background-color: var(--border);
    }
    progress-bar::-webkit-progress-value {
      background-color: var(--primary);
    }
    #output {
      width: 100%;
      height: 250px;
      resize: vertical;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background-color: rgba(59, 130, 246, 0.05);
      border-radius: 0.5rem;
    }
    .status-bar span {
      font-weight: 500;
      color: var(--primary);
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <h1>WebESP - ESP32/ESP8266 网页下载器</h1>
  <div class="container">
    <!-- 左侧控制区 -->
    <div class="card">
      <h2>设备控制</h2>
      <div class="form-group">
        <label for="baudrate">波特率</label>
        <select id="baudrate">
          <option value="9600">9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200" selected>115200</option>
          <option value="230400">230400</option>
          <option value="460800">460800</option>
        </select>
      </div>
      <div class="btn-group">
        <button id="connect">🔌 连接设备</button>
        <button id="erase" class="danger">🗑️ 擦除Flash</button>
      </div>

      <h3>文件配置</h3>
      <div id="file-list">
        <div class="file-entry">
          <input type="text" class="address-input" value="0x000000" placeholder="Flash地址">
          <input type="file" class="file-input">
          <button class="remove-file">-</button>
        </div>
      </div>
      <button id="add-file" class="secondary">➕ 添加文件</button>

      <div class="checkbox-group">
        <input type="checkbox" id="erase-all">
        <label for="erase-all">全片擦除</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="compress" checked>
        <label for="compress">启用压缩</label>
      </div>

      <progress-bar value="0" max="100"></progress-bar>
      <button id="flash" class="secondary" style="margin-top: 1rem;">⚡ 开始烧录</button>
    </div>

    <!-- 右侧日志区 -->
    <div class="card">
      <div class="status-bar">
        <span>设备状态: <span id="status">未连接</span></span>
        <span>芯片型号: <span id="device">未知</span></span>
      </div>
      <h2>输出日志</h2>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</body>
</html>
