<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>LILYGO Launchpad – 本地固件烧录器</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f5f5f5;
        color: #333;
    }
    .container {
        max-width: 600px;
        margin: 50px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        font-weight: 600;
        margin-bottom: 20px;
    }
    .upload-area {
        text-align: center;
        margin-bottom: 20px;
        padding: 20px;
        border: 2px dashed #bbb;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }
    .upload-area:hover {
        border-color: #007bff;
        background: #eef5ff;
    }
    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #005fcc;
    }
    pre {
        background: #111;
        color: #0f0;
        padding: 15px;
        height: 200px;
        overflow-y: auto;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>🔥 LILYGO Launchpad 本地固件刷写器</h2>

    <div class="upload-area" id="uploadBox">
        点击或拖拽固件进来（.bin）
    </div>

    <input type="file" id="firmwareFile" accept=".bin" style="display:none">

    <button id="flashBtn" disabled>⚡ 烧录固件</button>

    <pre id="log"></pre>
</div>

<!-- 使用 module 方式加载 esptool-js -->
<script type="module">
import { ESPLoader } from "https://unpkg.com/esptool-js@latest/bundle.js";

let firmwareData = null;
const logEl = document.getElementById("log");

function log(msg) {
    logEl.textContent += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
}

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("firmwareFile");

uploadBox.onclick = () => fileInput.click();

uploadBox.ondragover = (e) => { e.preventDefault(); uploadBox.style.background="#eef5ff"; };
uploadBox.ondragleave = () => uploadBox.style.background="";
uploadBox.ondrop = (e) => {
    e.preventDefault();
    uploadBox.style.background="";
    handleFile(e.dataTransfer.files[0]);
};

fileInput.onchange = () => handleFile(fileInput.files[0]);

function handleFile(file) {
    if (!file || !file.name.endsWith(".bin")) {
        alert("请选择 .bin 固件文件！");
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        firmwareData = new Uint8Array(reader.result);
        uploadBox.textContent = "已选择固件：" + file.name;
        document.getElementById("flashBtn").disabled = false;
        log("已加载固件：" + file.name);
    };
    reader.readAsArrayBuffer(file);
}

document.getElementById("flashBtn").onclick = async () => {
    if (!firmwareData) {
        alert("请先选择固件！");
        return;
    }

    try {
        log("请求串口权限…");
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const esploader = new ESPLoader({
            transport: port,
            baudrate: 115200,
            debug: true,
        });

        log("连接设备…");
        await esploader.connect();

        log("开始烧录…");
        await esploader.flashData(firmwareData, 0x0);

        log("🎉 烧录完成！设备将自动重启。");

    } catch (e) {
        log("❌ 错误：" + e);
    }
};
</script>

</body>
</html>
