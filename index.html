<!-- 步骤指示器 - 强调顺序 -->
<div class="step-indicator">
    <div class="step active" data-step="1">
        <span>1</span> 连接设备
        <div class="step-tooltip">首先连接你的ESP32设备</div>
    </div>
    <div class="step" data-step="2">
        <span>2</span> 选择固件
        <div class="step-tooltip">连接成功后选择要烧录的固件</div>
    </div>
    <div class="step" data-step="3">
        <span>3</span> 下载并烧录
        <div class="step-tooltip">确认后开始烧录</div>
    </div>
</div>

<!-- 连接状态面板 -->
<div class="connection-panel" id="connectionPanel">
    <div class="connection-status">
        <div class="status-icon" id="statusIcon">🔌</div>
        <div class="status-text">
            <h3 id="statusTitle">等待连接设备</h3>
            <p id="statusDescription">请点击下方按钮连接您的ESP32开发板</p>
        </div>
    </div>
    <button id="connectBtn" class="btn primary large">
        <i class="fas fa-plug"></i> 连接ESP32设备
    </button>
    <div class="connection-help">
        <p><i class="fas fa-lightbulb"></i> 提示：首次连接需要在浏览器弹出窗口中选择正确的串口设备</p>
    </div>
</div>

<!-- 固件选择面板 (初始隐藏) -->
<div class="firmware-panel hidden" id="firmwarePanel">
    <div class="panel-header">
        <h2><i class="fas fa-microchip"></i> 选择固件</h2>
        <div class="device-info">
            <span id="connectedDevice">设备: 未连接</span>
            <button id="changeDeviceBtn" class="btn small secondary">更换设备</button>
        </div>
    </div>
    
    <!-- 模式选择标签 -->
    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="quick">
            <i class="fas fa-bolt"></i> 快速示例
        </button>
        <button class="mode-tab" data-mode="custom">
            <i class="fas fa-upload"></i> 自定义固件
        </button>
        <button class="mode-tab" data-mode="url">
            <i class="fas fa-link"></i> 网络地址
        </button>
    </div>
    
    <!-- 快速示例模式 -->
    <div class="mode-content active" data-mode="quick">
        <div class="firmware-category">
            <h3><i class="fas fa-play-circle"></i> 入门示例</h3>
            <div class="firmware-grid" id="beginnerFirmwares"></div>
        </div>
        <div class="firmware-category">
            <h3><i class="fas fa-wifi"></i> 网络应用</h3>
            <div class="firmware-grid" id="networkFirmwares"></div>
        </div>
    </div>
    
    <!-- 自定义固件模式 -->
    <div class="mode-content" data-mode="custom">
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt fa-3x"></i>
            <p>拖放你的 .bin 文件到此处</p>
            <p class="file-types">支持 .bin, .elf 格式</p>
            <input type="file" id="localFile" accept=".bin,.elf" hidden>
            <button class="btn secondary" id="browseLocalBtn">选择本地文件</button>
        </div>
        <div class="file-info hidden" id="localFileInfo">
            <div class="file-details">
                <div><strong>文件名:</strong> <span id="localFileName">-</span></div>
                <div><strong>大小:</strong> <span id="localFileSize">-</span></div>
                <div><strong>类型:</strong> <span id="localFileType">-</span></div>
            </div>
        </div>
    </div>
    
    <!-- 网络地址模式 -->
    <div class="mode-content" data-mode="url">
        <div class="form-group">
            <label for="firmwareUrl"><i class="fas fa-link"></i> 固件URL地址</label>
            <input type="url" id="firmwareUrl" 
                   placeholder="https://example.com/firmware.bin">
            <button class="btn small" id="testUrlBtn">测试链接</button>
        </div>
        <div class="form-group">
            <label for="urlFlashAddress"><i class="fas fa-memory"></i> 烧录地址</label>
            <input type="text" id="urlFlashAddress" value="0x10000" placeholder="0x10000">
        </div>
    </div>
    
    <!-- 烧录设置 -->
    <div class="flash-settings">
        <h3><i class="fas fa-sliders-h"></i> 烧录设置</h3>
        <div class="settings-grid">
            <div class="setting">
                <label for="flashAddress"><i class="fas fa-map-marker-alt"></i> 烧录地址</label>
                <input type="text" id="flashAddress" value="0x10000">
                <small class="help-text">主固件通常为 0x10000</small>
            </div>
            <div class="setting">
                <label for="baudRate"><i class="fas fa-tachometer-alt"></i> 波特率</label>
                <select id="baudRate">
                    <option value="115200">115200</option>
                    <option value="921600" selected>921600</option>
                    <option value="460800">460800</option>
                </select>
            </div>
            <div class="setting">
                <label for="flashMode"><i class="fas fa-cogs"></i> Flash 模式</label>
                <select id="flashMode">
                    <option value="dio" selected>DIO</option>
                    <option value="qio">QIO</option>
                    <option value="dout">DOUT</option>
                </select>
            </div>
            <div class="setting">
                <label for="flashSize"><i class="fas fa-expand-arrows-alt"></i> Flash 大小</label>
                <select id="flashSize">
                    <option value="4MB">4MB</option>
                    <option value="8MB" selected>8MB</option>
                    <option value="16MB">16MB</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- 确认按钮 -->
    <div class="action-buttons">
        <button id="backToConnectBtn" class="btn secondary">
            <i class="fas fa-arrow-left"></i> 返回
        </button>
        <button id="selectAndFlashBtn" class="btn success large" disabled>
            <i class="fas fa-download"></i> 下载并烧录此固件
        </button>
    </div>
</div>

<!-- 烧录进度面板 (初始隐藏) -->
<div class="flash-progress-panel hidden" id="flashProgressPanel">
    <div class="progress-header">
        <h2><i class="fas fa-sync-alt fa-spin"></i> 正在烧录固件</h2>
        <button id="cancelFlashBtn" class="btn small danger">取消</button>
    </div>
    
    <div class="progress-info">
        <div class="info-item">
            <span>固件:</span>
            <strong id="flashingFirmwareName">-</strong>
        </div>
        <div class="info-item">
            <span>设备:</span>
            <strong id="flashingDeviceName">-</strong>
        </div>
        <div class="info-item">
            <span>地址:</span>
            <strong id="flashingAddress">-</strong>
        </div>
    </div>
    
    <!-- 进度条 -->
    <div class="progress-container">
        <div class="progress-labels">
            <span>烧录进度</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-stages">
            <div class="stage" data-stage="connect">连接</div>
            <div class="stage" data-stage="erase">擦除</div>
            <div class="stage" data-stage="write">写入</div>
            <div class="stage" data-stage="verify">校验</div>
            <div class="stage" data-stage="reset">重启</div>
        </div>
    </div>
    
    <!-- 详细控制台 -->
    <div class="detailed-console">
        <div class="console-header">
            <h3><i class="fas fa-terminal"></i> 烧录日志</h3>
            <div class="console-controls">
                <button id="clearLogBtn" class="btn small">清空</button>
                <button id="copyLogBtn" class="btn small">复制</button>
            </div>
        </div>
        <div id="detailedConsole" class="console-output">
            <div class="log-info">准备开始烧录...</div>
        </div>
    </div>
    
    <div class="flash-actions">
        <button id="restartFlashBtn" class="btn warning" disabled>
            <i class="fas fa-redo"></i> 重新烧录
        </button>
        <button id="finishFlashBtn" class="btn success" disabled>
            <i class="fas fa-check"></i> 完成
        </button>
    </div>
</div>
