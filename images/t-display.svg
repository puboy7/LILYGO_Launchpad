<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <!-- 设备主体外壳 -->
  <rect x="20" y="10" width="160" height="380" rx="12" ry="12" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 顶部 LILYGO 刻印文字 -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">LILYGO</text>
  
  <!-- 屏幕外框 -->
  <rect x="35" y="60" width="130" height="220" rx="6" ry="6" fill="#121212" stroke="#333" stroke-width="1"/>
  
  <!-- 屏幕显示区域 (纯黑，无文字) -->
  <rect x="40" y="65" width="120" height="210" rx="4" ry="4" fill="#000"/>
  
  <!-- 底部两个橙色按钮 -->
  <circle cx="70" cy="320" r="10" fill="#ff7f24" stroke="#cc661a" stroke-width="1"/>
  <circle cx="130" cy="320" r="10" fill="#ff7f24" stroke="#cc661a" stroke-width="1"/>
  
  <!-- 底部外壳细节线 -->
  <rect x="25" y="340" width="150" height="35" rx="4" ry="4" fill="none" stroke="#1a1a1a" stroke-width="1"/>
</svg>
